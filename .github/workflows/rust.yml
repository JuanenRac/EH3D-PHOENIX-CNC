name: EH3D Rust CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "images/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EH3D-PHOENIX-CNC
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check out the sibling repositories named in depends_on of the manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          owner, name = os.environ["GITHUB_REPOSITORY"].split("/")
          refs = dict(item.split("=", 1) for item in os.environ.get("SIBLING_REFS", "").split())
          pending, seen = [name], {name}
          while pending:
              manifest = json.loads(Path(pending.pop(), "eh3d.project.json").read_text(encoding="utf-8"))
              for dep in manifest.get("depends_on") or []:
                  if dep in seen:
                      continue
                  seen.add(dep)
                  ref = refs.get(dep)
                  command = ["git", "-c", "advice.detachedHead=false", "clone", "--quiet", "--depth", "1"] + (["--branch", ref] if ref else [])
                  subprocess.run(command + [f"https://github.com/{owner}/{dep}.git", dep], check=True)
                  print(f"{dep} at {ref or 'main'}")
                  pending.append(dep)
          PY
      - name: Linux libraries of the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Rust toolchain
        shell: bash
        working-directory: EH3D-PHOENIX-CNC
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: EH3D-PHOENIX-CNC
      - name: Format
        run: cargo fmt --all --check
        working-directory: EH3D-PHOENIX-CNC
      - name: Lints
        run: cargo clippy --all-targets --features gui -- -D warnings
        working-directory: EH3D-PHOENIX-CNC
      - name: Tests
        run: cargo test --all-targets --features gui
        working-directory: EH3D-PHOENIX-CNC

  main-against-main:
    name: Siblings at main
    # Builds this repository against the main branch of every sibling to see a break coming before the siblings are tagged; it does not hold a merge back.
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SIBLING_REFS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EH3D-PHOENIX-CNC
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check out the sibling repositories named in depends_on of the manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          owner, name = os.environ["GITHUB_REPOSITORY"].split("/")
          refs = dict(item.split("=", 1) for item in os.environ.get("SIBLING_REFS", "").split())
          pending, seen = [name], {name}
          while pending:
              manifest = json.loads(Path(pending.pop(), "eh3d.project.json").read_text(encoding="utf-8"))
              for dep in manifest.get("depends_on") or []:
                  if dep in seen:
                      continue
                  seen.add(dep)
                  ref = refs.get(dep)
                  command = ["git", "-c", "advice.detachedHead=false", "clone", "--quiet", "--depth", "1"] + (["--branch", ref] if ref else [])
                  subprocess.run(command + [f"https://github.com/{owner}/{dep}.git", dep], check=True)
                  print(f"{dep} at {ref or 'main'}")
                  pending.append(dep)
          PY
      - name: Linux libraries of the window
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Rust toolchain
        shell: bash
        working-directory: EH3D-PHOENIX-CNC
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Build against the sibling main branches
        run: cargo check --all-targets --features gui
        working-directory: EH3D-PHOENIX-CNC
