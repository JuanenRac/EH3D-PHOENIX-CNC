name: EH3D CI baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The tag of each sibling repository this one is built against (name=tag, separated by spaces); a sibling that is not listed is taken at main.
  SIBLING_REFS: "EH3D-COMMON=v0.1.9"

jobs:
  validate:
    name: Validate the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Manifest, documentation and language parity
        run: python -I tools/ci_validate.py
      - name: Pictures of the README
        run: |
          python -I tools/make_architecture.py --check
          python -I tools/make_structure.py --check --readmes

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: EH3D-PHOENIX-CNC
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check out the sibling repositories named in depends_on of the manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          owner, name = os.environ["GITHUB_REPOSITORY"].split("/")
          refs = dict(item.split("=", 1) for item in os.environ.get("SIBLING_REFS", "").split())
          pending, seen = [name], {name}
          while pending:
              manifest = json.loads(Path(pending.pop(), "eh3d.project.json").read_text(encoding="utf-8"))
              for dep in manifest.get("depends_on") or []:
                  if dep in seen:
                      continue
                  seen.add(dep)
                  ref = refs.get(dep)
                  command = ["git", "-c", "advice.detachedHead=false", "clone", "--quiet", "--depth", "1"] + (["--branch", ref] if ref else [])
                  subprocess.run(command + [f"https://github.com/{owner}/{dep}.git", dep], check=True)
                  print(f"{dep} at {ref or 'main'}")
                  pending.append(dep)
          PY
      - name: Linux libraries of the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all --check
        working-directory: EH3D-PHOENIX-CNC
      - name: Lints
        run: cargo clippy --all-targets --features gui -- -D warnings
        working-directory: EH3D-PHOENIX-CNC
      - name: Tests
        run: cargo test --all-targets --features gui
        working-directory: EH3D-PHOENIX-CNC

  main-against-main:
    name: Siblings at main
    # Builds this repository against the main branch of every sibling to see a break coming before the siblings are tagged; it does not hold a merge back.
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SIBLING_REFS: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: EH3D-PHOENIX-CNC
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check out the sibling repositories named in depends_on of the manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          owner, name = os.environ["GITHUB_REPOSITORY"].split("/")
          refs = dict(item.split("=", 1) for item in os.environ.get("SIBLING_REFS", "").split())
          pending, seen = [name], {name}
          while pending:
              manifest = json.loads(Path(pending.pop(), "eh3d.project.json").read_text(encoding="utf-8"))
              for dep in manifest.get("depends_on") or []:
                  if dep in seen:
                      continue
                  seen.add(dep)
                  ref = refs.get(dep)
                  command = ["git", "-c", "advice.detachedHead=false", "clone", "--quiet", "--depth", "1"] + (["--branch", ref] if ref else [])
                  subprocess.run(command + [f"https://github.com/{owner}/{dep}.git", dep], check=True)
                  print(f"{dep} at {ref or 'main'}")
                  pending.append(dep)
          PY
      - name: Linux libraries of the window
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build against the sibling main branches
        run: cargo check --all-targets --features gui
        working-directory: EH3D-PHOENIX-CNC
