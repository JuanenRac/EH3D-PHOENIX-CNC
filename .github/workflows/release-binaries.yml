name: Release binaries

# Builds the program for Windows (64 and 32 bits), Linux and macOS (Apple silicon and Intel) and keeps the packages as artifacts of the run.
# The release itself is published from the maintainer's machine, which downloads these artifacts, so that the notes and the assets
# of every repository of the ecosystem are made the same way. Run it by hand: Actions > Release binaries > Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The tag of each sibling repository the release is built from (name=tag, separated by spaces); a sibling that is not listed is taken at main.
  SIBLING_REFS: "EH3D-COMMON=v0.1.1"

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-x86_64, target: x86_64-unknown-linux-gnu, ext: "", archive: tar.gz }
          - { os: windows-latest, label: windows-x86_64, target: x86_64-pc-windows-msvc, ext: ".exe", archive: zip }
          - { os: windows-latest, label: windows-x86, target: i686-pc-windows-msvc, ext: ".exe", archive: zip }
          - { os: macos-latest, label: macos-arm64, target: aarch64-apple-darwin, ext: "", archive: tar.gz }
          - { os: macos-latest, label: macos-x86_64, target: x86_64-apple-darwin, ext: "", archive: tar.gz }
    steps:
      - uses: actions/checkout@v5
        with:
          path: EH3D-MOTIONCNC
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check out the sibling repositories named in depends_on of the manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          owner, name = os.environ["GITHUB_REPOSITORY"].split("/")
          refs = dict(item.split("=", 1) for item in os.environ.get("SIBLING_REFS", "").split())
          pending, seen = [name], {name}
          while pending:
              manifest = json.loads(Path(pending.pop(), "eh3d.project.json").read_text(encoding="utf-8"))
              for dep in manifest.get("depends_on") or []:
                  if dep in seen:
                      continue
                  seen.add(dep)
                  ref = refs.get(dep)
                  command = ["git", "-c", "advice.detachedHead=false", "clone", "--quiet", "--depth", "1"] + (["--branch", ref] if ref else [])
                  subprocess.run(command + [f"https://github.com/{owner}/{dep}.git", dep], check=True)
                  print(f"{dep} at {ref or 'main'}")
                  pending.append(dep)
          PY
      - name: Linux libraries of the window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Tests
        run: cargo test --all-targets
        working-directory: EH3D-MOTIONCNC
      - name: Build
        run: cargo build --release --features gui --target ${{ matrix.target }}
        working-directory: EH3D-MOTIONCNC
      - name: Package
        shell: bash
        working-directory: EH3D-MOTIONCNC
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('eh3d.project.json'))['version'])")
          name="motioncnc-${version}-${{ matrix.label }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/motioncnc${{ matrix.ext }}" "$name/"
          cp LICENSE README.md CHANGELOG.md "$name/"
          # sample G-code programs, from the simplest to a long one
          cp -r examples "$name/examples"
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "dist/${name}.zip" "$name" >/dev/null
            asset="dist/${name}.zip"
          else
            tar -czf "dist/${name}.tar.gz" "$name"
            asset="dist/${name}.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$asset" | sed 's#dist/##' > "${asset}.sha256"; else shasum -a 256 "$asset" | sed 's#dist/##' > "${asset}.sha256"; fi
          cat "${asset}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: motioncnc-${{ matrix.label }}
          path: EH3D-MOTIONCNC/dist/*
          if-no-files-found: error
