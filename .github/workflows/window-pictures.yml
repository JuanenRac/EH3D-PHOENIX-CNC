name: Window pictures

# Takes the pictures of the window with the picture mode of the program (`--shot`) on a virtual screen and keeps them as an artifact of the run, so the
# pictures of the README can be renewed without building the window on a personal machine. Run it by hand: Actions > Window pictures > Run workflow; then put the pictures of the
# artifact in images/screens/ and in a pull request.

on:
  workflow_dispatch:
  push:
    branches: [release-ready]

permissions:
  contents: read

concurrency:
  group: window-pictures
  cancel-in-progress: false

env:
  # The tags of the sibling repositories the window is built against.
  COMMON_REF: "v0.3.4"
  CORE_LIBS_REF: "v0.1.3"

jobs:
  pictures:
    name: Take the pictures of the window
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: EH3D-PHOENIX-CNC
      - name: The sibling repositories the window is built against
        shell: bash
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "${COMMON_REF}" "https://github.com/${GITHUB_REPOSITORY_OWNER}/EH3D-COMMON.git" EH3D-COMMON
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "${CORE_LIBS_REF}" "https://github.com/${GITHUB_REPOSITORY_OWNER}/EH3D-CORE-LIBS.git" EH3D-CORE-LIBS
      - name: Libraries of the window and a virtual screen
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgl1-mesa-dri xvfb fonts-noto-cjk
      - name: Rust toolchain
        shell: bash
        working-directory: EH3D-PHOENIX-CNC
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Build the window
        working-directory: EH3D-PHOENIX-CNC
        run: cargo build --release --features gui
      - name: Take the pictures
        # the programs are named from the folder of the repository, so that no path of the machine appears in a picture;
        # every picture has a home folder of its own, and the files of the examples a fixed time of change
        working-directory: EH3D-PHOENIX-CNC
        shell: bash
        run: |
          set -euo pipefail
          exe="$GITHUB_WORKSPACE/EH3D-PHOENIX-CNC/target/release/phoenix-cnc"
          out="$GITHUB_WORKSPACE/window-pictures"
          mkdir -p "$out"
          touch -d "2026-01-01 12:00:00 UTC" examples/*
          shot() {
            local name="$1"; shift
            rm -rf /tmp/pictures && mkdir -p /tmp/pictures/home /tmp/pictures/config/eh3d
            # the workspace Run of the window: the state of the machine and the hand control beside the path
            printf '%s\n' 'dock.version = 1' 'dock.current = 0' 'dock.ws.0.name = Run' \
              'dock.ws.0.tree = H240(V500(T0(position),T0(jog)),H700(V740(T0(viewer),T0(console)),T0(job,files)))' \
              > /tmp/pictures/config/eh3d/phoenix-cnc.cfg
            HOME=/tmp/pictures/home XDG_CONFIG_HOME=/tmp/pictures/config xvfb-run -a -s "-screen 0 1920x1080x24" timeout 180 "$exe" "$@" --shot "$out/phoenix-cnc-$name.png"
            test -s "$out/phoenix-cnc-$name.png"
          }
          shot 01-running --lang en --theme forge examples/02_frame_and_pocket.nc --start --wait 14
          for wait in 2 4 6 9; do shot "01-running-$wait" --lang en --theme forge examples/02_frame_and_pocket.nc --start --wait "$wait"; done
          shot 02-midnight --lang en --theme midnight examples/03_spiral.nc --start --wait 600
          shot 03-german-light --lang de --theme paper examples/02_frame_and_pocket.nc --start --wait 120
          shot 04-settings --lang en --theme forge examples/01_square.nc --window settings --wait 20
          shot 05-open --lang en --theme forge examples/01_square.nc --window open --wait 20
          shot 06-machine --lang en --theme forge examples/02_frame_and_pocket.nc --window machine --wait 20
          shot 07-settings-atc --lang en --theme forge examples/01_square.nc --window settings-atc --wait 20
          ls -l "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window-pictures
          path: window-pictures/*.png
          if-no-files-found: error
          retention-days: 14
