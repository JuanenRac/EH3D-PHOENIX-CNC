[package]
name = "eh3d-phoenix-cnc"
version = "0.2.3"
edition = "2021"
description = "The EH3D machine-control program: a window over a controller, a simulated one so far"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-PHOENIX-CNC"
readme = "README.md"

[features]
default = []
gui = ["dep:eframe", "dep:png", "dep:arboard", "eh3d-view/gui", "eh3d-dock/gui"]
# GRBL, grblHAL and Marlin on a real serial port
serial = ["eh3d-controller/serial"]

[dependencies]
eh3d-view = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/view" }
# the frame of the window: panels that dock, float and fold, workspaces, the menu bar; the model has no window, the drawing is the feature `gui`
eh3d-dock = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/dock", default-features = false }
eh3d-controller = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/controller" }
# the materials a router works, with their starting points (feed, speed, depth), in the eight languages
eh3d-materials = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/materials" }
eh3d-filedialog = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/filedialog" }
eh3d-serverclient = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/serverclient" }
eh3d-summary = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/summary" }
# the readers of Gerber and Excellon, the geometry and the CAM of the boards: what the other programs of the suite use for the same files
eh3d-cam = { version = ">=0.1.2", path = "../EH3D-CORE-LIBS/crates/eh3d-cam" }
eh3d-geometry = { version = ">=0.1.2", path = "../EH3D-CORE-LIBS/crates/eh3d-geometry" }
eh3d-parser-excellon = { version = ">=0.1.2", path = "../EH3D-CORE-LIBS/crates/eh3d-parser-excellon" }
eh3d-parser-gerber = { version = ">=0.1.2", path = "../EH3D-CORE-LIBS/crates/eh3d-parser-gerber" }
# the `.eh3d` project of the suite, one file with a branch for each program: this program writes only `cnc/`
eh3d-project = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/project" }
eh3d-container = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/container" }
serde_json = "1"
sha2 = "0.10"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"], optional = true }
png = { version = "0.17", optional = true }
# only to know whether the clipboard holds text (the menu of the right button greys Paste out when it does not)
arboard = { version = "3", default-features = false, optional = true }

# the window of Linux needs a windowing system chosen at build time (X11 and Wayland); Windows and macOS have their own
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "x11", "wayland"], optional = true }

[[bin]]
name = "phoenix-cnc"
path = "src/bin/phoenix-cnc.rs"
required-features = ["gui"]

[profile.dev]
# a lighter debug build: the file and line of a panic stay, the full debug symbols (the bulk of the target folder) do not
debug = "line-tables-only"

# the icon and the version information of the Windows executable (build.rs; nothing on other systems)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
